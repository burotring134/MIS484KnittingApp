# Docker compose for local infra. Optional — MongoDB runs fine via brew on
# macOS dev boxes (`brew services start mongodb-community`). This file is
# here for two reasons:
#   1) When MinIO is added (see docs/storage.md § 5), having both services
#      in one place keeps `docker compose up` as the single dev-bring-up
#      command.
#   2) For Linux dev / CI / Docker-using teammates who don't have brew.
#
# Currently only mongo is wired into backend (lib/mongo.js). MinIO will be
# wired in faz 3 of docs/storage.md.
#
# Volumes are bind-mounted under .docker/ so blowing them away is a single
# `rm -rf .docker/` away.

services:
  mongo:
    image: mongo:7
    container_name: threadia-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - ./.docker/mongo-data:/data/db

  # MinIO — uncomment when faz 3 of storage migration starts.

# Docker compose for Threadia.
#
# Local dev: `docker compose up -d` brings up mongo only — the backend can
# run via `npm run dev` against it. For full-stack containerised mode (prod
# server, or to reproduce prod locally) use the `backend` service below.
#
# Production: on the deploy host, `docker compose up -d` brings up both
# mongo and backend. Backend reads .env from the repo root and overrides
# MONGO_URL to point at the mongo service.

services:
  mongo:
    image: mongo:7
    container_name: threadia-mongo
    restart: unless-stopped
    # No host port binding — backend reaches mongo over the compose network
    # at mongo:27017. Avoids conflict with any host-native mongod on 27017.
    volumes:
      - ./.docker/mongo-data:/data/db

  backend:
    build:
      context: ./backend
    container_name: threadia-backend
    restart: unless-stopped
    depends_on:
      - mongo
    env_file:
      - ./.env
    environment:
      MONGO_URL: mongodb://mongo:27017/threadia
      PORT: 5001
    ports:
      - "5001:5001"
